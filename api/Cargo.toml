[package]
name = "api"
version = "0.1.0"
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-web = { version = "4.12.1", features = ["openssl"] }
actix-multipart = "0.7.2"
openssl = { version = "0.10.75" }
actix-files = "0.6.8"
serde = { version = "1.0.228", features = ["derive"] }
shellexpand = "3.1.1"
walkdir = "2.5.0"
serde_json = "1.0.148"
git2 = { version = "0.20.3" }
comrak = { version = "0.49.0" }
clap = { version = "4.5.53", features = ["derive", "cargo"] }
tera = "1.20.1"
rexiv2 = "0.10.0"
regex = "1.12.2"
base64 = "0.22.1"
bytebuffer = "2.3.0"